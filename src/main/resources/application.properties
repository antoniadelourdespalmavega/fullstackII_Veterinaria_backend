# ---------------- Servidor ----------------
server.port=8080

# ---------------- Base de datos (H2 guardada en un archivo, así los datos no se pierden al apagar) ----------------
spring.datasource.url=jdbc:h2:file:./data/veterinaria;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# "update" crea las tablas la primera vez y las conserva después
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Consola web para ver las tablas: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Spring Security crea por defecto un usuario "user" con clave aleatoria que aquí no se usa (el login es por JWT)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------------- JWT ----------------
# Clave secreta para firmar los tokens (mínimo 32 caracteres). En producción va en una variable de entorno.
app.jwt.secret=${JWT_SECRET:veterinaria-san-marcos-clave-secreta-para-jwt-2026-no-compartir}
# El token de acceso dura 30 minutos y el de renovación 7 días (en milisegundos)
app.jwt.access-expiration-ms=1800000
app.jwt.refresh-expiration-ms=604800000

# ---------------- CORS: dirección del frontend (React con Vite) ----------------
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ---------------- Swagger ----------------
# http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------- Swagger sin token ----------------
# true = las peticiones hechas DESDE Swagger no piden token (entran como administrador).
# La app React sigue exigiendo login y JWT. Poner false para volver a pedir el token en Swagger.
app.swagger.sin-token=true
